[package]
name = "cartesi-rollups-prt-node"
version = { workspace = true }

authors = { workspace = true }
description = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license-file = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }

[dependencies]
cartesi-machine = { workspace = true }
cartesi-dave-contracts = { workspace = true }

cartesi-rollups-contracts = { workspace = true }
cartesi-prt-contracts = { workspace = true }

# the folded-in kms signer (formerly common-rs/kms)
aws-config = { version = "1.6", default-features = false, features = [
    "rustls",
    "rt-tokio",
] }
aws-sdk-kms = { version = "1.65", default-features = false, features = [
    "rustls",
    "rt-tokio",
] }

# the folded-in merkle module (formerly common-rs/merkle)
ruint = { workspace = true }
tiny-keccak = { workspace = true }

alloy = { workspace = true, features = ["signer-aws"] }
alloy-transport = { workspace = true }
alloy-chains = { workspace = true }
reqwest = { workspace = true }

anyhow = { workspace = true }
async-recursion = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }
hex = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
env_logger = "0.11.5"

[dev-dependencies]
alloy = { workspace = true, features = ["json-rpc", "node-bindings", "rpc-types"] }
hex = "0.4.3"
tempfile = "3"
tower = "0.5"
# the kms module's localstack round-trip test
testcontainers-modules = { version = "0.13.0", default-features = false, features = [
    "localstack",
] }
