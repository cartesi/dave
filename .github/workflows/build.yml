name: Build
# Push covers the long-lived branches and release tags; pull_request
# covers everything else, including forks (which get no CI at all
# under a bare push trigger). The concurrency group below dedupes.
on:
  push:
    branches:
      - main
      - "next/*"
    tags:
      - "v*"
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prt-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Install Cartesi Machine
        uses: ./.github/actions/cartesi-machine
        with:
          version: 0.20.0
          suffix-version: ""

      - name: Setup env
        run: |
          just setup-local

      - name: Build, format check and test prt contracts
        working-directory: ./prt/contracts
        run: |
          just check-fmt
          just build-smart-contracts
          just test-disputes
          just test-stf

  dave-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Download PRT contracts
        working-directory: ./prt/contracts
        run: |
          just install-deps

      - name: Download Rollups contracts
        working-directory: ./cartesi-rollups/contracts
        run: |
          just install-deps

      - name: Build, format check and test Dave consensus contracts
        working-directory: ./cartesi-rollups/contracts
        run: |
          just check-fmt
          just build-smart-contracts
          just test

  prt-honeypot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Setup tools
        uses: ./.github/actions/setup-tools
      - name: Install Cartesi Machine
        uses: ./.github/actions/cartesi-machine
        with:
          version: 0.20.0
      - name: Download PRT contracts
        working-directory: ./prt/contracts
        run: |
          just install-deps
      - name: Download Rollups contracts
        working-directory: ./cartesi-rollups/contracts
        run: |
          just install-deps
      - name: Build devnet
        working-directory: ./cartesi-rollups/contracts
        run: |
          just build-devnet
      - name: Download deps
        working-directory: ./test/programs/
        run: |
          just download-deps
      - name: Rust build
        run: |
          just build
      - name: Build honeypot
        working-directory: ./test/programs/
        run: |
          just build-honeypot-snapshot
      - name: Build echo
        working-directory: ./test/programs/
        run: |
          just build-echo
      - name: Test prt-rollups
        timeout-minutes: 20
        run: |
          just test-rollups-honeypot-ci
      # B2 batched sibling: SIGKILL mid advance batch, the resumed run
      # must re-execute the batch and settle identically to the oracle.
      # Cheap (no dispute), and the only e2e that puts a full
      # multi-record batch under the kill (the harness default is
      # gap 2, small batches).
      - name: Test batched catch-up kill
        timeout-minutes: 15
        run: |
          just test-rollups-kill-ci
      # B1 chaos loop (docs/plans/characterization.md): the dispute must
      # survive SIGKILL/respawn fire. Fixed seed: CI is the regression
      # net; seed exploration stays in local runs.
      - name: Test chaos
        timeout-minutes: 15
        env:
          CHAOS_SEED: "1"
        run: |
          just test-rollups-chaos
      # The state-transition coverage suite: every on-chain STF shape
      # driven through a real dispute (docs/test-harness.md coverage
      # matrix). The battery's most valuable net; it rotted once while
      # living outside CI.
      - name: Test stf_all
        timeout-minutes: 60
        run: |
          just test-rollups-honeypot-stf
      - name: Show failing log
        if: failure()
        run: |
          echo '▼▼▼ failing-step dave.log ▼▼▼'
          cat ./prt/tests/rollups/dave.log
          echo '▲▲▲ end log ▲▲▲'


  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup tools
        uses: ./.github/actions/setup-tools

      - name: Install dependencies
        env:
          XGENEXT2_VERSION: 1.5.6
          ARCH: amd64
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            build-essential git wget \
            libslirp-dev \
            libclang-dev \
            liblua5.4-dev lua5.4 lua-check \
            xxd jq sqlite3 libc6 clang libarchive13

          wget -O xgenext2fs.deb https://github.com/cartesi/genext2fs/releases/download/v${XGENEXT2_VERSION}/xgenext2fs_${ARCH}.deb
          sudo apt-get install -y ./xgenext2fs.deb
          rm ./xgenext2fs.deb
          xgenext2fs --version

      # The from-source emulator build dominates this job. The tree is
      # make-based and the diff apply detects an already-patched tree,
      # so on a cache hit the same recipes below no-op; on an emulator
      # bump the key changes and the from-source path runs for real.
      - name: Emulator cache key
        id: emulator-key
        run: echo "sha=$(git rev-parse HEAD:machine/emulator)" >> "$GITHUB_OUTPUT"

      - name: Cache emulator build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: machine/emulator
          key: emulator-build-${{ runner.os }}-${{ steps.emulator-key.outputs.sha }}

      # The version and diff hash live in the justfile recipe; CI must
      # not carry its own copy of either. Dependency form (`setup`)
      # deliberately: chaining recipes on one CLI feeds the NEXT
      # recipe name into a parameterized recipe's arguments (just's
      # grammar) - `apply-generated-files-diff build-emulator` once
      # downloaded release "build-emulator" and 404ed silently.
      - name: Install Cartesi Machine
        run: |
          just setup
          sudo make -C machine/emulator install

      - name: Setup env
        run: |
          just setup-local

      # The same targets `just check` runs locally, one step each so a
      # failure is legible in the Actions UI.
      - name: Rust fmt and check
        run: |
          just check-fmt-rust-workspace
          just check-rust-workspace

      - name: Clippy
        run: |
          just clippy-rust-workspace

      - name: Lua lint
        run: |
          just lint-lua

      - name: Rust build
        run: |
          just build

      - name: Rust test workspace
        run: |
          just test-rust-workspace

  build-release-node:
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    container:
      image: rust:1.90-trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
          build-essential git wget curl \
          liblua5.4-dev lua5.4 \
          libslirp-dev libboost1.83-dev \
          libclang-dev \
          xxd jq sqlite3

      - name: Install dependency for ARM
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          apt-get install -y --no-install-recommends \
            g++-aarch64-linux-gnu

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        with:
          setup-qemu: false
          setup-rust: false

      - name: Contracts
        run: |
          just -f test/programs/justfile download-deps
          just -f prt/contracts/justfile install-deps
          just -f cartesi-rollups/contracts/justfile install-deps
          just build-smart-contracts
          just bind

      - name: Cartesi Machine Sys
        working-directory: machine/rust-bindings
        run: |
          cargo build --release -p cartesi-machine-sys --features download_uarch --target ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build --release -p cartesi-rollups-prt-node --target ${{ matrix.target }}
          cp -v ./target/${{ matrix.target }}/release/cartesi-rollups-prt-node cartesi-rollups-prt-node

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cartesi-rollups-prt-node-linux-${{ matrix.arch }}
          path: |
            ./cartesi-rollups-prt-node
          if-no-files-found: error
          retention-days: 1

  release-node:
    needs: [prt-contracts, dave-contracts, prt-honeypot, build, build-release-node]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create directory
        run: mkdir -p upload

      - name: Extract version from tag
        id: extract_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cartesi-rollups-prt-node-linux-${{ matrix.arch }}

      - name: Change node binary file permissions
        run: chmod 755 cartesi-rollups-prt-node

      - name: Compress node binary
        run: tar -czf "$FILEPATH" cartesi-rollups-prt-node
        env:
          FILEPATH: upload/cartesi-rollups-prt-${{ steps.extract_version.outputs.version }}-node-${{ matrix.arch }}.tar.gz

      - name: Upload assets to release on GitHub
        run: gh release upload "$TAG" upload/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  release-contracts:
    needs: [prt-contracts, dave-contracts, prt-honeypot, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Create directory
        run: |
          mkdir -p upload

      - name: Extract version from tag
        id: extract_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup tools
        uses: ./.github/actions/setup-tools
        id: setup

      - name: Build PRT Core contracts
        working-directory: ./prt/contracts
        run: |
          just install-deps
          forge clean
          forge build src

      - name: Build Cartesi Rollups PRT contracts
        working-directory: ./cartesi-rollups/contracts
        run: |
          just install-deps
          forge clean
          forge build src

      - name: Compress contract artifacts
        run: tar -czf "$FILEPATH" prt/contracts/out cartesi-rollups/contracts/out
        env:
          FILEPATH: upload/cartesi-rollups-prt-${{ steps.extract_version.outputs.version }}-contract-artifacts.tar.gz

      - name: Simulate deployment to supported testnets and mainnets
        working-directory: ./cartesi-rollups/contracts
        run: |
          ./script/deploy-testnets.sh
          ./script/deploy-mainnets.sh

      - name: Compress testnet and mainnet deployment simulation artifacts
        run: tar -czf "$FILEPATH" -C cartesi-rollups/contracts deployments
        env:
          FILEPATH: upload/cartesi-rollups-prt-${{ steps.extract_version.outputs.version }}-deployment-addresses.tar.gz

      - name: Build devnet
        working-directory: ./cartesi-rollups/contracts
        run: |
          just build-devnet

      - name: Compress devnet artifacts
        run: tar -czf "$FILEPATH" -C cartesi-rollups/contracts deployments/31337 state.json
        env:
          FILEPATH: upload/cartesi-rollups-prt-${{ steps.extract_version.outputs.version }}-anvil-${{ steps.setup.outputs.installed-foundry-version }}.tar.gz

      - name: Upload assets to release on GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "$TAG" upload/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
