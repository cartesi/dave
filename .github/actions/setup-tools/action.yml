name: setup-tools
description: Install base tools
inputs:
  target:
    description: 'Architecture to build for (if Rust is setup)'
    required: false
    default: 'x86_64-unknown-linux-gnu'
  rust-version:
    description: 'Rust version to install (if Rust is setup)'
    required: false
    # Keep in step with the release container (rust:1.90-trixie in
    # build.yml); the workspace uses post-1.86 std APIs.
    default: '1.90'
  setup-qemu:
    description: 'Whether to setup QEMU for riscv support'
    required: false
    default: 'false'
  setup-rust:
    description: 'Whether to setup Rust'
    required: false
    default: 'true'
outputs:
  installed-foundry-version:
    description: 'The version of Foundry that was installed'
    value: ${{ steps.set-foundry-version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Set up QEMU for riscv support
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      if: ${{ inputs.setup-qemu == 'true' }}

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      if: ${{ inputs.setup-rust == 'true' }}
      with:
        components: rustfmt,clippy
        target: ${{ inputs.target }}
        toolchain: ${{ inputs.rust-version }}
        cache-on-failure: false
        cache-bin: false

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        # Pinned like the other toolchain components: a floating "latest"
        # upgrades CI's toolchain silently mid-week (1.56 -> 1.57
        # landed between two runs of this workflow and muddied a
        # two-day CI hunt). Bump deliberately.
        just-version: "1.57.0"

    - name: Set Foundry version
      id: set-foundry-version
      shell: bash
      run: |
        echo "version=$(just print-foundry-version)" >> "$GITHUB_OUTPUT"

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: ${{ steps.set-foundry-version.outputs.version }}
