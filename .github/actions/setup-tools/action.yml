name: setup-tools
description: Install base tools
inputs:
  target:
    description: 'Architecture to build for (if Rust is setup)'
    required: false
    default: 'x86_64-unknown-linux-gnu'
  rust-version:
    description: 'Rust version to install (if Rust is setup)'
    required: false
    # Keep in step with the release container (rust:1.94-trixie in
    # build.yml); the workspace uses post-1.86 std APIs.
    default: '1.94'
  setup-rust:
    description: 'Whether to setup Rust'
    required: false
    default: 'true'
outputs:
  installed-foundry-version:
    description: 'The version of Foundry that was installed'
    value: ${{ steps.set-foundry-version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      if: ${{ inputs.setup-rust == 'true' }}
      with:
        components: rustfmt,clippy
        target: ${{ inputs.target }}
        toolchain: ${{ inputs.rust-version }}
        cache-on-failure: false
        cache-bin: false

    - name: Install just
      shell: bash
      run: |
        # Pin deliberately: floating latest silently changes CI's toolchain.
        # Fetch the pinned asset directly: release-list lookup has reported
        # this published version missing during CI setup.
        version=1.57.0
        case "$(uname -m)" in
          x86_64)
            target=x86_64-unknown-linux-musl
            checksum=45b548094283cb9739af8f13273b8cddeee869f5b4ef2bb631b1f311cb566155
            ;;
          aarch64)
            target=aarch64-unknown-linux-musl
            checksum=f225044a81adea6e0b3a8b9370aaf374e6af76c8735ae263ac993df55fd137ec
            ;;
          *) echo "Unsupported just host architecture: $(uname -m)" >&2; exit 1 ;;
        esac
        install_dir=$(mktemp -d "${RUNNER_TEMP}/just.XXXXXX")
        archive="${install_dir}/just.tar.gz"
        curl --fail --location --retry 3 \
          "https://github.com/casey/just/releases/download/${version}/just-${version}-${target}.tar.gz" \
          --output "$archive"
        printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
        tar -xzf "$archive" -C "$install_dir" just
        "$install_dir/just" --version
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Set Foundry version
      id: set-foundry-version
      shell: bash
      run: |
        echo "version=$(just print-foundry-version)" >> "$GITHUB_OUTPUT"

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        version: ${{ steps.set-foundry-version.outputs.version }}
